# ==============================================================================
# Property Finder Real Estate (PFRE) — Production Nginx Configuration
# Domain: propertyfinderrealestate.com & www.propertyfinderrealestate.com
# ==============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=pfre_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=pfre_api:10m rate=5r/s;

# Upstream definition for Omni Platform backend (Laravel API)
upstream pfre_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP -> HTTPS Redirect (IPv4 & IPv6, all hostnames)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name propertyfinderrealestate.com www.propertyfinderrealestate.com;

    # ACME challenge for Let's Encrypt renewal
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://www.propertyfinderrealestate.com$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Non-WWW -> Canonical WWW Redirect
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name propertyfinderrealestate.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/propertyfinderrealestate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/propertyfinderrealestate.com/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    return 301 https://www.propertyfinderrealestate.com$request_uri;
}

# ------------------------------------------------------------------------------
# 3. Canonical HTTPS Production Server
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.propertyfinderrealestate.com;

    root /var/www/propertyfinderrealestate.com;
    index index.html;

    # Charset
    charset utf-8;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/propertyfinderrealestate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/propertyfinderrealestate.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/propertyfinderrealestate.com/chain.pem;

    # SSL Security & Performance
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Global Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.propertyfinderrealestate.com http://localhost:8000 https://formspree.io; frame-src https://www.google.com https://challenges.cloudflare.com; form-action 'self' https://formspree.io; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Client limits
    client_max_body_size 16M;
    client_body_buffer_size 128k;

    # --------------------------------------------------------------------------
    # Clean URLs & Static Routing
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=pfre_general burst=30 nodelay;
        try_files $uri $uri/ $uri.html =404;
    }

    # --------------------------------------------------------------------------
    # API Backend Proxy (Laravel Omni Platform)
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=pfre_api burst=10 nodelay;
        proxy_pass http://pfre_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # PWA Service Worker (Never Cache)
    # --------------------------------------------------------------------------
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Service-Worker-Allowed "/";
        expires 0;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Web App Manifest & SEO Essentials
    # --------------------------------------------------------------------------
    location = /manifest.json {
        add_header Content-Type "application/manifest+json; charset=utf-8";
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location = /robots.txt {
        add_header Content-Type "text/plain; charset=utf-8";
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        add_header Content-Type "application/xml; charset=utf-8";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Static Assets & Media Caching (1 Year Immutable)
    # --------------------------------------------------------------------------
    location ~* \.(?:css|js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ~* \.(?:woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Security Denials & Blocked Files
    # --------------------------------------------------------------------------
    # Deny dotfiles (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block sensitive development files from serving directly
    location ~* (package\.json|package-lock\.json|build\.js|composer\.json|composer\.lock|\.md)$ {
        deny all;
        return 404;
    }

    # --------------------------------------------------------------------------
    # Custom Error Pages
    # --------------------------------------------------------------------------
    error_page 403 /403.html;
    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;

    location = /403.html {
        internal;
    }

    location = /404.html {
        internal;
    }

    location = /500.html {
        internal;
    }
}