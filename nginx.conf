# =====================================================================
#  Property Finder Real Estate — Nginx Server Configuration
#  www.propertyfinderrealestate.com
#
#  Deploy path:
#    /etc/nginx/sites-available/propertyfinderrealestate.com
#
#  Enable:
#    sudo ln -s /etc/nginx/sites-available/propertyfinderrealestate.com \
#               /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  SSL certificate (free, auto-renews):
#    sudo certbot --nginx -d propertyfinderrealestate.com \
#                         -d www.propertyfinderrealestate.com
#
#  Static files live at:
#    /var/www/pfre-website/
#  (Upload the contents of dist/ after running: node build.js)
# =====================================================================

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name propertyfinderrealestate.com www.propertyfinderrealestate.com;

    # Let Certbot manage the ACME challenge — do NOT redirect this
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://www.propertyfinderrealestate.com$request_uri;
    }
}

# ── Non-www → www canonical redirect ─────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name propertyfinderrealestate.com;

    ssl_certificate     /etc/letsencrypt/live/propertyfinderrealestate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/propertyfinderrealestate.com/privkey.pem;

    return 301 https://www.propertyfinderrealestate.com$request_uri;
}

# ── Main HTTPS server ─────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.propertyfinderrealestate.com;

    root  /var/www/pfre-website;
    index index.html;

    # ── SSL ────────────────────────────────────────────────────────────
    ssl_certificate      /etc/letsencrypt/live/propertyfinderrealestate.com/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/propertyfinderrealestate.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/propertyfinderrealestate.com/chain.pem;
    ssl_dhparam          /etc/ssl/certs/dhparam.pem;  # generate: openssl dhparam -out /etc/ssl/certs/dhparam.pem 2048

    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;
    ssl_session_tickets  off;
    ssl_stapling         on;
    ssl_stapling_verify  on;
    resolver             8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout     5s;

    # ── HSTS ──────────────────────────────────────────────────────────
    # max-age=31536000 = 1 year. Only enable includeSubDomains if ALL
    # subdomains (including api.) serve HTTPS. Add to the HSTS preload
    # list at hstspreload.org once the site has been live for 1 month.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Security headers ───────────────────────────────────────────────
    # NOTE: These are the server-side equivalents of the meta http-equiv
    # tags already in the HTML — real HTTP headers take precedence and
    # cover cases the meta tags can't (e.g. service-worker scope, 404 pages).
    add_header X-Content-Type-Options    "nosniff"                   always;
    add_header X-Frame-Options           "SAMEORIGIN"                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self), payment=()" always;

    # Content Security Policy — matches the meta CSP already in every page.
    # Having it here as a real header is strictly stronger because:
    #   a) HTTP headers cannot be bypassed by removing the meta tag
    #   b) This CSP covers the error pages (403/500) which have simpler heads
    #   c) Service workers and fetch() respect HTTP CSP headers, not meta tags
    add_header Content-Security-Policy "
        default-src 'self';
        script-src  'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://challenges.cloudflare.com;
        style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src    'self' https://fonts.gstatic.com;
        img-src     'self' data: https:;
        connect-src 'self' https://api.propertyfinderrealestate.com https://formspree.io;
        frame-src   https://www.google.com https://challenges.cloudflare.com;
        form-action 'self' https://formspree.io;
        object-src  'none';
        base-uri    'self';
        frame-ancestors 'none';
    " always;

    # ── Compression ────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/x-javascript
        application/xml application/xml+rss application/manifest+json
        image/svg+xml;

    # ── Logging ────────────────────────────────────────────────────────
    access_log /var/log/nginx/pfre-access.log;
    error_log  /var/log/nginx/pfre-error.log;

    # ── Cache headers ──────────────────────────────────────────────────
    # HTML: no-cache (must revalidate — catches sw.js BUILD_ID changes)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache"                             always;
        add_header Expires       "0"                                    always;
        try_files $uri $uri/ =404;
    }

    # Service worker: never cache — browser must always get the latest version
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # Manifest and robots: short cache — changes occasionally
    location ~* \.(webmanifest|manifest\.json|txt)$ {
        add_header Cache-Control "public, max-age=86400";  # 1 day
        try_files $uri =404;
    }

    # Minified CSS/JS: long cache (filenames don't change, BUILD_ID in sw.js handles invalidation)
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";  # 1 year
        try_files $uri =404;
    }

    # Images and fonts: long cache
    location ~* \.(svg|png|jpg|jpeg|gif|webp|ico|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";  # needed for @font-face cross-origin
        try_files $uri =404;
    }

    # ── Block access to internal tool pages from external bots ─────────
    # (Also in robots.txt, but HTTP 403 is more definitive than a crawl hint)
    # NOTE: The tools are still usable by staff who know the URL — this only
    # blocks automated access without JS (Googlebot, scrapers). The pages
    # themselves have a clickjacking guard via X-Frame-Options.
    location ~* ^/(admin|crm|analytics|agreement-registration|business-blueprint|email-templates)\.html$ {
        # Serve the file normally to browsers (they set Accept: text/html)
        # Block headless/curl access (no Accept header or Accept: */*)
        if ($http_accept !~* "text/html") {
            return 403;
        }
        try_files $uri =404;
    }

    # ── Error pages ────────────────────────────────────────────────────
    error_page 400 403 /403.html;
    error_page 404     /404.html;
    error_page 500 502 503 504 /500.html;

    location = /403.html { internal; }
    location = /404.html { internal; }
    location = /500.html { internal; }

    # ── Main location ──────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # ── Security: hide nginx version ───────────────────────────────────
    server_tokens off;

    # ── Rate limit for API proxy (if you ever reverse-proxy to Laravel) ─
    # Uncomment and adjust if adding: proxy_pass http://127.0.0.1:8000;
    # limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    # location /api/ {
    #     limit_req zone=api burst=10 nodelay;
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
