server {
    listen 80;
    listen [::]:80;
    server_name propertyfinderrealestate.com www.propertyfinderrealestate.com;
    return 301 https://www.propertyfinderrealestate.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name propertyfinderrealestate.com;
    return 301 https://www.propertyfinderrealestate.com$request_uri;

    ssl_certificate     /etc/letsencrypt/live/propertyfinderrealestate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/propertyfinderrealestate.com/privkey.pem;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.propertyfinderrealestate.com;

    root /var/www/propertyfinderrealestate.com/dist;
    index index.html;

    # SSL hardening
    ssl_certificate     /etc/letsencrypt/live/propertyfinderrealestate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/propertyfinderrealestate.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers (W3C / OWASP Standards)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.propertyfinderrealestate.com http://localhost:8000 https://formspree.io; frame-src https://www.google.com https://challenges.cloudflare.com; form-action 'self' https://formspree.io; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff2;

    # Clean URL handling (try exact file, then .html, then directory index)
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Service Worker must never be cached by the browser
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Static Assets Cache (1 Year)
    location ~* \.(?:css|js|woff2|png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Explicit Error Document Mapping
    error_page 403 /403.html;
    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;

    location = /403.html { internal; }
    location = /404.html { internal; }
    location = /500.html { internal; }
}