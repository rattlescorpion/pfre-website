<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- frame-ancestors removed from meta CSP per W3C standards; configure via server headers -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https: http://localhost:8000; object-src 'none'; base-uri 'self'">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sign In — Property Finder RE Management Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070C14;
  --card:#0F1729;
  --card2:#111B2E;
  --border:#1A2744;
  --blue:#3B82F6;
  --blue-hover:#2563EB;
  --text:#E2E8F0;
  --text-2:#94A3B8;
  --text-3:#475569;
  --red:#EF4444;
  --green:#10B981;
  --amber:#F59E0B;
}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:radial-gradient(circle at center, #0F1A30 0%, var(--bg) 100%);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.login-card{
  background:var(--card);
  border:1.5px solid var(--border);
  border-radius:20px;
  padding:36px 32px;
  max-width:420px;
  width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}
.login-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.login-logo-mark{
  width:42px;
  height:42px;
  border-radius:10px;
  background:rgba(59,130,246,.15);
  border:1px solid rgba(59,130,246,.3);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}
.login-header-title{font-size:15px;font-weight:700;color:var(--text);line-height:1.2}
.login-header-sub{font-size:11px;color:var(--blue);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
h1{font-family:'Playfair Display',serif;font-size:22px;margin-bottom:4px;color:var(--text)}
.login-sub{font-size:13px;color:var(--text-2);margin-bottom:20px}
.field{margin-bottom:16px}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.field input{
  width:100%;
  padding:12px 14px;
  background:var(--card2);
  border:1.5px solid var(--border);
  border-radius:10px;
  color:var(--text);
  font-size:14px;
  font-family:inherit;
  outline:none;
  transition:border-color .2s;
}
.field input:focus{border-color:var(--blue)}
.btn-login{
  width:100%;
  padding:13px;
  background:var(--blue);
  color:#fff;
  border:none;
  border-radius:10px;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  margin-top:6px;
  transition:background .2s, transform .15s;
}
.btn-login:hover{background:var(--blue-hover);transform:translateY(-1px)}
.btn-login:disabled{opacity:.6;cursor:wait;transform:none}
.err-box{
  background:rgba(239,68,68,.12);
  border:1px solid rgba(239,68,68,.35);
  color:#fca5a5;
  padding:10px 14px;
  border-radius:9px;
  font-size:12.5px;
  margin-bottom:16px;
  display:none;
}
.mode-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  font-weight:600;
  padding:4px 10px;
  border-radius:100px;
  margin-bottom:18px;
}
.mode-live{background:rgba(16,185,129,.12);color:var(--green)}
.mode-demo{background:rgba(245,158,11,.12);color:var(--amber)}

/* Demo Switcher */
.demo-box{
  margin-top:24px;
  padding:14px;
  background:rgba(255,255,255,.02);
  border:1px dashed var(--border);
  border-radius:10px;
  font-size:12px;
  color:var(--text-2);
}
.demo-box-title{font-size:11px;font-weight:700;color:var(--text);text-transform:uppercase;margin-bottom:8px;letter-spacing:.5px}
.demo-pills{display:flex;flex-wrap:wrap;gap:6px}
.demo-pill{
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:6px;
  padding:5px 9px;
  font-size:11.5px;
  color:var(--text);
  cursor:pointer;
  transition:all .15s;
}
.demo-pill:hover{border-color:var(--blue);color:var(--blue)}
</style>
</head>
<body>

<main class="login-card">
  <div class="login-header">
    <div class="login-logo-mark">🏠</div>
    <div>
      <div class="login-header-title">Property Finder Real Estate</div>
      <div class="login-header-sub">Management Portal</div>
    </div>
  </div>

  <h1>Account Sign In</h1>
  <p class="login-sub">Authenticate to access ERP, lead flows, and catalog controls.</p>

  <div id="mode-badge" class="mode-badge mode-demo">Checking server connection…</div>
  <div class="err-box" id="err-box" role="alert"></div>

  <form id="login-form" onsubmit="event.preventDefault(); handleLogin();">
    <div class="field">
      <label for="email">Work Email</label>
      <input type="email" id="email" autocomplete="username" placeholder="name@propertyfinderrealestate.com" required>
    </div>
    <div class="field">
      <label for="password">Password / Authorization PIN</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn-login" id="login-btn">Authenticate Session</button>
  </form>

  <div class="demo-box" id="demo-box">
    <div class="demo-box-title">Quick Test Sign-In (Role Presets)</div>
    <div class="demo-pills">
      <button type="button" class="demo-pill" onclick="fillRole('super_admin')">⭐ Super Admin</button>
      <button type="button" class="demo-pill" onclick="fillRole('admin')">🏢 Operations Admin</button>
      <button type="button" class="demo-pill" onclick="fillRole('agent')">👥 Field Agent</button>
    </div>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
const LIVE = !!(window.PFRE_CONFIG?.FEATURES?.LIVE_AUTH && window.PFRE_CONFIG?.API_BASE_URL);

/* Seeded RBAC directory for offline and demo deployments */
const DEMO_ACCOUNTS = [
  {
    email: 'propertyfinderre@gmail.com',
    password: 'demo123',
    name: 'Saurav Ganesh Chowdhury',
    role: 'super_admin',
    defaultRoute: 'admin.html',
    permissions: ['all']
  },
  {
    email: 'operations@propertyfinderrealestate.com',
    password: 'demo123',
    name: 'Arshiya Imtiyaz Shaikh',
    role: 'admin',
    defaultRoute: 'admin.html',
    permissions: ['crm', 'agreements', 'schedule', 'inventory_read']
  },
  {
    email: 'agent@propertyfinderrealestate.com',
    password: 'demo123',
    name: 'Abhishek Ganesh Sable',
    role: 'agent',
    defaultRoute: 'crm.html',
    permissions: ['crm_own_leads', 'schedule_own']
  }
];

function fillRole(roleKey) {
  const account = DEMO_ACCOUNTS.find(u => u.role === roleKey);
  if (!account) return;
  document.getElementById('email').value = account.email;
  document.getElementById('password').value = account.password;
}

function showError(msg) {
  const box = document.getElementById('err-box');
  box.textContent = msg;
  box.style.display = 'block';
}

function createSession(user, token) {
  const sessionData = {
    name: user.name,
    email: user.email,
    role: user.role,
    permissions: user.permissions || [],
    token: token || null,
    loginAt: Date.now(),
    expiresAt: Date.now() + (12 * 60 * 60 * 1000) // 12-hour expiration window
  };

  localStorage.setItem('pfre_session', JSON.stringify(sessionData));

  // Determine post-login destination
  const redirectParam = new URLSearchParams(location.search).get('redirect');
  const safeRedirect = redirectParam && /^[\w.-]+\.html$/.test(redirectParam) ? redirectParam : null;

  if (safeRedirect) {
    window.location.href = safeRedirect;
  } else if (user.role === 'agent') {
    window.location.href = 'crm.html';
  } else {
    window.location.href = 'admin.html';
  }
}

async function handleLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('login-btn');
  document.getElementById('err-box').style.display = 'none';

  if (!email || !password) {
    showError('Please supply both work email and credentials.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Verifying Credentials…';

  if (LIVE) {
    try {
      const res = await fetch(`${window.PFRE_CONFIG.API_BASE_URL}/auth/login`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-PFRE-Key': window.PFRE_CONFIG.API_KEY || ''
        },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok && data.success) {
        createSession(data.data.user, data.data.token);
        return;
      }
      showError(data.message || 'Invalid credentials or inactive account.');
    } catch (_) {
      showError('Unable to reach authentication server. Falling back to offline cache.');
    }
  } else {
    // Offline simulation delay
    await new Promise(r => setTimeout(r, 350));
    const match = DEMO_ACCOUNTS.find(
      u => u.email.toLowerCase() === email.toLowerCase() && u.password === password
    );

    if (match) {
      createSession(match);
      return;
    }
    showError('Account not found. Use one of the demo presets below or verify your password.');
  }

  btn.disabled = false;
  btn.textContent = 'Authenticate Session';
}

document.addEventListener('DOMContentLoaded', () => {
  const badge = document.getElementById('mode-badge');
  if (LIVE) {
    badge.textContent = '🟢 Live API Authentication Connected';
    badge.className = 'mode-badge mode-live';
    document.getElementById('demo-box').style.display = 'none';
  } else {
    badge.textContent = '🟡 Local Simulation / Demo Mode';
    badge.className = 'mode-badge mode-demo';
  }

  // Auto-skip login if valid active session exists
  try {
    const s = JSON.parse(localStorage.getItem('pfre_session') || 'null');
    if (s && s.expiresAt > Date.now()) {
      window.location.href = s.role === 'agent' ? 'crm.html' : 'admin.html';
    }
  } catch (_) {}
});
</script>
</body>
</html>
