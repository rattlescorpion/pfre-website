<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Directory — Property Finder Real Estate</title>
  <meta name="robots" content="noindex, nofollow">

  <!-- Security & CSP -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https: http://localhost:8000; object-src 'none'; base-uri 'self'">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">

  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#070C14">

  <!-- Auth Guard & Theme -->
  <script src="/js/auth-guard.js"></script>
  <script>
    !function(){var t=localStorage.getItem("pfre_theme")||(window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);document.documentElement.classList.add("theme-"+t)}();
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #070C14;
      --sidebar: #0A0F1E;
      --card: #0F1729;
      --card2: #111B2E;
      --border: #1A2744;
      --blue: #3B82F6;
      --green: #10B981;
      --red: #EF4444;
      --amber: #F59E0B;
      --purple: #8B5CF6;
      --text: #E2E8F0;
      --text-2: #94A3B8;
      --text-3: #475569;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 230px;
      min-height: 100vh;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      left: 0; top: 0; bottom: 0;
      z-index: 100;
      overflow-y: auto;
    }
    .sb-logo { padding: 20px 18px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .sb-logo img { height: 34px; width: auto; }
    .sb-logo-text { font-size: 13px; font-weight: 700; color: var(--text); }
    .sb-section { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-3); padding: 16px 18px 6px; }
    .sb-item { display: flex; align-items: center; gap: 10px; padding: 9px 18px; color: var(--text-2); font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; border-left: 2px solid transparent; transition: all .15s; }
    .sb-item:hover { background: rgba(59,130,246,.06); color: var(--text); }
    .sb-item.active { background: rgba(59,130,246,.12); color: var(--blue); border-left-color: var(--blue); font-weight: 600; }

    /* Main Workspace */
    .main { margin-left: 230px; flex: 1; min-height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: rgba(7, 12, 20, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .topbar-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }

    .btn { padding: 8px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--text); display: inline-flex; align-items: center; gap: 6px; transition: all .15s; }
    .btn:hover { border-color: var(--blue); color: var(--blue); }
    .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn-primary:hover { background: #2563EB; color: #fff; }

    /* Search & Filter Bar */
    .search-row { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .search-box { flex: 1; min-width: 260px; position: relative; }
    .search-input { width: 100%; padding: 10px 14px 10px 38px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--card2); color: var(--text); font-size: 13.5px; outline: none; }
    .search-input:focus { border-color: var(--blue); }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 15px; }
    .filter-select { padding: 9px 14px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--card2); color: var(--text); font-size: 13px; outline: none; }

    /* Directory Layout with Samsung A-Z Scrubber */
    .directory-container { display: flex; flex: 1; position: relative; }
    .contact-list-area { flex: 1; padding: 20px 24px; }
    .az-scrubber {
      width: 28px;
      position: sticky;
      top: 56px;
      height: calc(100vh - 56px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      background: rgba(15, 23, 41, 0.4);
      border-left: 1px solid var(--border);
      user-select: none;
      padding: 6px 0;
    }
    .az-char { font-size: 11px; font-weight: 700; color: var(--text-3); cursor: pointer; text-decoration: none; padding: 2px 4px; transition: color .15s; }
    .az-char:hover { color: var(--blue); transform: scale(1.2); }

    /* Contact Row Card */
    .contact-group-header { font-size: 13px; font-weight: 800; color: var(--blue); padding: 12px 0 6px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
    .contact-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all .2s;
    }
    .contact-card:hover { border-color: var(--blue); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
    .contact-left { display: flex; align-items: center; gap: 14px; }
    .avatar-circle {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }
    .c-name { font-size: 14.5px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .c-meta { font-size: 12px; color: var(--text-2); margin-top: 3px; }
    .star-btn { background: none; border: none; cursor: pointer; font-size: 18px; line-height: 1; }

    .tag-badge { padding: 2px 8px; border-radius: 100px; font-size: 10.5px; font-weight: 700; }
    .tag-buyer { background: rgba(59,130,246,.15); color: #3B82F6; }
    .tag-investor { background: rgba(139,92,246,.15); color: #8B5CF6; }
    .tag-landlord { background: rgba(16,185,129,.15); color: #10B981; }
    .tag-partner { background: rgba(245,158,11,.15); color: #F59E0B; }

    .contact-actions { display: flex; gap: 6px; }

    /* Modal Styling */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
    .modal-overlay.open { display: flex; }
    .modal-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 18px; width: 100%; max-width: 760px; max-height: 90vh; overflow-y: auto; padding: 28px; }
    .form-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 14px; }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 11.5px; font-weight: 700; text-transform: uppercase; color: var(--text-2); margin-bottom: 6px; }
    .form-control { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--card2); color: var(--text); font-size: 13.5px; outline: none; font-family: inherit; }
    .form-control:focus { border-color: var(--blue); }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-left: 0; }
      .form-grid-3, .form-grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sb-logo">
      <img src="/images/logo.png" alt="PFRE" onerror="this.style.display='none'">
      <div>
        <div class="sb-logo-text">Property Finder RE</div>
        <div style="font-size:10px;color:var(--blue);font-weight:600;text-transform:uppercase;">Directory Suite</div>
      </div>
    </div>

    <div class="sb-section">Directories</div>
    <a href="contacts.html" class="sb-item active"><span>👥</span><span>All Contacts</span></a>
    <a href="#" class="sb-item" onclick="filterByTag('Buyer')"><span>🛒</span><span>Buyers &amp; Investors</span></a>
    <a href="#" class="sb-item" onclick="filterByTag('Landlord')"><span>🏠</span><span>Landlords &amp; Owners</span></a>
    <a href="#" class="sb-item" onclick="filterByTag('Partner')"><span>🤝</span><span>Channel Partners</span></a>

    <div class="sb-section">Operations</div>
    <a href="crm.html" class="sb-item"><span>🏗️</span><span>CRM Pipelines</span></a>
    <a href="admin.html" class="sb-item"><span>⚙️</span><span>Admin Console</span></a>
    <a href="schedule.html" class="sb-item"><span>📅</span><span>Site Schedules</span></a>
  </aside>

  <!-- MAIN AREA -->
  <main class="main" id="main-content">
    <header class="topbar">
      <div class="topbar-title">
        <span>📖 Contact Directory</span>
        <span id="totalBadge" style="font-size:12px;background:var(--border);padding:2px 8px;border-radius:100px;font-weight:600;">0 contacts</span>
      </div>
      <div class="topbar-actions">
        <button class="btn" onclick="exportMasterVCF()" type="button">📲 Export All vCard</button>
        <button class="btn btn-primary" onclick="openAddModal()" type="button">+ New Contact</button>
      </div>
    </header>

    <!-- SEARCH & FILTER TOOLBAR -->
    <div class="search-row">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Search by name, mobile, society, PAN, or budget..." oninput="handleSearch()">
      </div>
      <select id="typeFilter" class="filter-select" onchange="handleSearch()">
        <option value="all">All Stakeholder Types</option>
        <option value="Buyer">Buyers</option>
        <option value="Investor">Investors</option>
        <option value="Landlord">Landlords</option>
        <option value="Partner">Channel Partners</option>
      </select>
    </div>

    <!-- DIRECTORY & A-Z SCRUBBER WRAPPER -->
    <div class="directory-container">
      <div class="contact-list-area" id="contactList">
        <!-- Rendered dynamically -->
      </div>

      <!-- Samsung A-Z Quick Scrubber -->
      <nav class="az-scrubber" id="azScrubber" aria-label="Alphabetical Jump"></nav>
    </div>
  </main>

  <!-- ADD / EDIT CONTACT MODAL (Google + Samsung + REMS Fields) -->
  <div class="modal-overlay" id="contactModal">
    <div class="modal-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:14px;">
        <h3 id="modalTitle" style="font-size:18px;font-weight:700;">Add New Contact</h3>
        <button onclick="closeModal()" style="background:none;border:none;color:var(--text-3);font-size:20px;cursor:pointer;">✕</button>
      </div>

      <form id="contactForm" onsubmit="event.preventDefault(); saveContact();">
        <input type="hidden" id="cId">

        <!-- 1. Name Breakdown (Samsung / Google Spec) -->
        <div class="form-grid-3">
          <div class="form-group">
            <label for="cPrefix">Prefix</label>
            <input type="text" id="cPrefix" class="form-control" placeholder="Mr. / Mrs. / Dr.">
          </div>
          <div class="form-group">
            <label for="cFirstName">First Name *</label>
            <input type="text" id="cFirstName" class="form-control" required placeholder="First Name">
          </div>
          <div class="form-group">
            <label for="cLastName">Last Name</label>
            <input type="text" id="cLastName" class="form-control" placeholder="Last Name">
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label for="cNickname">Nickname / Reference</label>
            <input type="text" id="cNickname" class="form-control" placeholder="e.g. Marina 2BHK Investor">
          </div>
          <div class="form-group">
            <label for="cCompany">Company / Employer</label>
            <input type="text" id="cCompany" class="form-control" placeholder="e.g. TCS / Self-Employed">
          </div>
        </div>

        <!-- 2. Phone Numbers & WhatsApp -->
        <div class="form-grid-2">
          <div class="form-group">
            <label for="cPrimaryPhone">Primary Mobile *</label>
            <input type="tel" id="cPrimaryPhone" class="form-control" required placeholder="+91 98201 XXXXX">
          </div>
          <div class="form-group">
            <label for="cWaPhone">WhatsApp Number</label>
            <input type="tel" id="cWaPhone" class="form-control" placeholder="+91 98201 XXXXX">
          </div>
        </div>

        <!-- 3. Emails & Dates -->
        <div class="form-grid-2">
          <div class="form-group">
            <label for="cEmail">Personal / Work Email</label>
            <input type="email" id="cEmail" class="form-control" placeholder="name@example.com">
          </div>
          <div class="form-group">
            <label for="cBirthday">Birthday (Anniversary Sync)</label>
            <input type="date" id="cBirthday" class="form-control">
          </div>
        </div>

        <!-- 4. Real Estate (REMS / ERP) Extensions -->
        <div class="form-grid-3">
          <div class="form-group">
            <label for="cType">Stakeholder Type</label>
            <select id="cType" class="form-control">
              <option value="Buyer">Buyer</option>
              <option value="Investor">Investor</option>
              <option value="Landlord">Landlord / Owner</option>
              <option value="Partner">Channel Partner / Broker</option>
              <option value="Tenant">Tenant</option>
            </select>
          </div>
          <div class="form-group">
            <label for="cBudget">Budget Bracket</label>
            <input type="text" id="cBudget" class="form-control" placeholder="e.g. ₹1.5 Cr – ₹2.2 Cr">
          </div>
          <div class="form-group">
            <label for="cPan">PAN (Registration Docs)</label>
            <input type="text" id="cPan" class="form-control" placeholder="ABCDE1234F">
          </div>
        </div>

        <div class="form-group">
          <label for="cAddress">Residential / Office Address</label>
          <input type="text" id="cAddress" class="form-control" placeholder="Flat No, Building, Road, Malad West, Mumbai - 400095">
        </div>

        <div class="form-group">
          <label for="cNotes">Confidential Notes / Requirements</label>
          <textarea id="cNotes" class="form-control" rows="3" placeholder="Specific carpet area, Vaastu preference, parking requirements..."></textarea>
        </div>

        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px;border-top:1px solid var(--border);padding-top:16px;">
          <button type="button" class="btn" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save to Phonebook</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    /* =====================================================
       PHONEBOOK DIRECTORY CONTROLLER
       ===================================================== */
    const STORAGE_KEY = 'pfre_phonebook_contacts';
    let directory = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

    // Build Samsung A-Z Quick Scrubber Bar
    const azChars = '#ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    const scrubberEl = document.getElementById('azScrubber');
    azChars.forEach(ch => {
      const a = document.createElement('a');
      a.className = 'az-char';
      a.textContent = ch;
      a.onclick = () => scrollToLetter(ch);
      scrubberEl.appendChild(a);
    });

    function scrollToLetter(letter) {
      const target = document.getElementById('group-' + letter);
      if (target) target.scrollIntoView({ behavior: 'smooth' });
    }

    function renderContacts(data = directory) {
      const container = document.getElementById('contactList');
      document.getElementById('totalBadge').textContent = `${data.length} contacts`;

      if (!data.length) {
        container.innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-3);">No matching contacts found in phonebook.</div>';
        return;
      }

      // Group alphabetically
      const grouped = {};
      data.forEach(c => {
        const firstLetter = (c.name.displayName || 'A').charAt(0).toUpperCase();
        const key = /[A-Z]/.test(firstLetter) ? firstLetter : '#';
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(c);
      });

      const sortedKeys = Object.keys(grouped).sort();
      let html = '';

      sortedKeys.forEach(key => {
        html += `<div class="contact-group-header" id="group-${key}">${key}</div>`;
        grouped[key].sort((a, b) => a.name.displayName.localeCompare(b.name.displayName)).forEach(c => {
          const initials = c.name.displayName.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
          const primaryPhone = c.phones?.[0]?.number || 'No phone';
          const type = c.rems?.contactType || 'Buyer';

          html += `
            <div class="contact-card">
              <div class="contact-left">
                <div class="avatar-circle">${initials}</div>
                <div>
                  <div class="c-name">
                    <span>${c.name.displayName}</span>
                    <span class="tag-badge tag-${type.toLowerCase()}">${type}</span>
                    ${c.rems?.vipStarred ? '⭐' : ''}
                  </div>
                  <div class="c-meta">
                    📞 ${primaryPhone} &nbsp;·&nbsp;
                    📍 ${c.addresses?.[0]?.city || c.addresses?.[0]?.street || 'Mumbai'}
                    ${c.rems?.budgetRange ? `&nbsp;·&nbsp; <strong>${c.rems.budgetRange}</strong>` : ''}
                  </div>
                </div>
              </div>
              <div class="contact-actions">
                <a href="tel:${primaryPhone.replace(/\s+/g,'')}" class="btn" title="Call">📞</a>
                <a href="https://wa.me/${primaryPhone.replace(/\D/g,'')}" target="_blank" rel="noopener noreferrer" class="btn" title="WhatsApp">💬</a>
                <button class="btn" onclick="downloadSingleVCF('${c.id}')" title="Save to Phone">📲</button>
                <button class="btn" onclick="openEditModal('${c.id}')" title="Edit">✏️</button>
                <button class="btn" onclick="deleteContact('${c.id}')" title="Delete" style="color:var(--red);">🗑</button>
              </div>
            </div>
          `;
        });
      });

      container.innerHTML = html;
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const typeFilter = document.getElementById('typeFilter').value;

      const filtered = directory.filter(c => {
        const matchesQ = !q ||
          (c.name.displayName || '').toLowerCase().includes(q) ||
          (c.phones || []).some(p => p.number.includes(q)) ||
          (c.rems?.budgetRange || '').toLowerCase().includes(q) ||
          (c.addresses || []).some(a => (a.street + a.city).toLowerCase().includes(q)) ||
          (c.rems?.panNumber || '').toLowerCase().includes(q);

        const matchesType = typeFilter === 'all' || c.rems?.contactType === typeFilter;
        return matchesQ && matchesType;
      });

      renderContacts(filtered);
    }

    function filterByTag(tag) {
      document.getElementById('typeFilter').value = tag;
      handleSearch();
    }

    /* Modal Form Operations */
    function openAddModal() {
      document.getElementById('modalTitle').textContent = 'Add New Contact';
      document.getElementById('contactForm').reset();
      document.getElementById('cId').value = '';
      document.getElementById('contactModal').classList.add('open');
    }

    function openEditModal(id) {
      const c = directory.find(x => x.id === id);
      if (!c) return;
      document.getElementById('modalTitle').textContent = 'Edit Contact';
      document.getElementById('cId').value = c.id;
      document.getElementById('cPrefix').value = c.name?.prefix || '';
      document.getElementById('cFirstName').value = c.name?.firstName || '';
      document.getElementById('cLastName').value = c.name?.lastName || '';
      document.getElementById('cNickname').value = c.name?.nickname || '';
      document.getElementById('cCompany').value = c.organization?.company || '';
      document.getElementById('cPrimaryPhone').value = c.phones?.[0]?.number || '';
      document.getElementById('cWaPhone').value = c.phones?.[1]?.number || '';
      document.getElementById('cEmail').value = c.emails?.[0]?.address || '';
      document.getElementById('cBirthday').value = c.dates?.birthday || '';
      document.getElementById('cType').value = c.rems?.contactType || 'Buyer';
      document.getElementById('cBudget').value = c.rems?.budgetRange || '';
      document.getElementById('cPan').value = c.rems?.panNumber || '';
      document.getElementById('cAddress').value = c.addresses?.[0]?.street || '';
      document.getElementById('cNotes').value = c.notes || '';
      document.getElementById('contactModal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('contactModal').classList.remove('open');
    }

    function saveContact() {
      const id = document.getElementById('cId').value;
      const fName = document.getElementById('cFirstName').value.trim();
      const lName = document.getElementById('cLastName').value.trim();
      const dName = [fName, lName].filter(Boolean).join(' ');

      const record = {
        id: id || 'c-' + Date.now().toString(36),
        name: {
          prefix: document.getElementById('cPrefix').value.trim(),
          firstName: fName,
          lastName: lName,
          displayName: dName,
          nickname: document.getElementById('cNickname').value.trim()
        },
        organization: { company: document.getElementById('cCompany').value.trim() },
        phones: [
          { type: 'Mobile', number: document.getElementById('cPrimaryPhone').value.trim(), isPrimary: true },
          { type: 'WhatsApp', number: document.getElementById('cWaPhone').value.trim() || document.getElementById('cPrimaryPhone').value.trim() }
        ],
        emails: [{ type: 'Primary', address: document.getElementById('cEmail').value.trim() }],
        dates: { birthday: document.getElementById('cBirthday').value },
        addresses: [{ type: 'Residence', street: document.getElementById('cAddress').value.trim(), city: 'Mumbai' }],
        rems: {
          contactType: document.getElementById('cType').value,
          budgetRange: document.getElementById('cBudget').value.trim(),
          panNumber: document.getElementById('cPan').value.trim().toUpperCase(),
          vipStarred: false
        },
        notes: document.getElementById('cNotes').value.trim(),
        updatedAt: new Date().toISOString()
      };

      if (id) {
        const idx = directory.findIndex(x => x.id === id);
        if (idx !== -1) directory[idx] = record;
      } else {
        directory.unshift(record);
      }

      localStorage.setItem(STORAGE_KEY, JSON.stringify(directory));
      closeModal();
      handleSearch();
    }

    function deleteContact(id) {
      if (!confirm('Are you sure you want to remove this contact from the directory?')) return;
      directory = directory.filter(x => x.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(directory));
      handleSearch();
    }

    /* vCard (.vcf) Export Engine for Android / iOS / Google Sync */
    function generateVCardString(c) {
      const tel = c.phones?.[0]?.number || '';
      const email = c.emails?.[0]?.address || '';
      return [
        'BEGIN:VCARD',
        'VERSION:3.0',
        `FN:${c.name.displayName}`,
        `N:${c.name.lastName || ''};${c.name.firstName || ''};;;`,
        `TEL;TYPE=CELL:${tel}`,
        email ? `EMAIL;TYPE=INTERNET:${email}` : '',
        c.organization?.company ? `ORG:${c.organization.company}` : 'ORG:Property Finder Real Estate',
        c.notes ? `NOTE:${c.notes.replace(/\n/g, ' ')}` : '',
        'END:VCARD'
      ].filter(Boolean).join('\r\n');
    }

    function downloadSingleVCF(id) {
      const c = directory.find(x => x.id === id);
      if (!c) return;
      const vcfData = generateVCardString(c);
      const blob = new Blob([vcfData], { type: 'text/vcard;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${c.name.displayName.replace(/\s+/g, '_')}.vcf`;
      a.click();
    }

    function exportMasterVCF() {
      if (!directory.length) return alert('No contacts to export.');
      const allVcf = directory.map(generateVCardString).join('\r\n');
      const blob = new Blob([allVcf], { type: 'text/vcard;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `PFRE_Master_Contacts_${new Date().toISOString().slice(0,10)}.vcf`;
      a.click();
    }

    // Initialize with sample records if clean
    if (!directory.length) {
      directory = [
        {
          id: 'c-1',
          name: { firstName: 'Rahul', lastName: 'Sharma', displayName: 'Rahul Sharma' },
          phones: [{ type: 'Mobile', number: '+91 98201 12345' }],
          rems: { contactType: 'Buyer', budgetRange: '₹1.80 Cr', panNumber: 'ABCPS1234F', vipStarred: true },
          addresses: [{ street: 'Marina Enclave, Malad West' }]
        },
        {
          id: 'c-2',
          name: { firstName: 'Amit', lastName: 'Patil', displayName: 'Amit Patil' },
          phones: [{ type: 'Mobile', number: '+91 98202 54321' }],
          rems: { contactType: 'Landlord', budgetRange: '₹45,000 / mo' },
          addresses: [{ street: 'Auris Serenity, Link Road' }]
        }
      ];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(directory));
    }

    renderContacts();
  </script>
