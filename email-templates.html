/* ═══ RENDER ENGINE ═══ */
function getData() {
  const dateVal = document.getElementById('fDate').value;
  const timeVal = document.getElementById('fTime').value;
  return {
    name:        document.getElementById('fName').value || 'Valued Client',
    phone:       document.getElementById('fPhone').value,
    property:    document.getElementById('fProperty').value || 'Property',
    dateDisplay: dateVal ? new Date(dateVal).toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'}) : 'To be confirmed',
    timeDisplay: timeVal ? formatTime(timeVal) : 'To be confirmed',
    amount:      document.getElementById('fAmount').value || '—',
    note:        document.getElementById('fNote').value,
  };
}
function formatTime(t) {
  const [h,m] = t.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}

function renderLogo() {
  return `<div class="ep-logo">
    <svg width="36" height="36" viewBox="0 0 40 40" fill="none">
      <circle cx="17" cy="17" r="13" stroke="white" stroke-width="2.5"/>
      <path d="M17 22V18" stroke="white" stroke-width="2" stroke-linecap="round"/>
      <rect x="14" y="18" width="6" height="4" rx="0.5" stroke="white" stroke-width="2"/>
      <path d="M12 18L17 13L22 18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M27 27L33 33" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <div class="ep-logo-text"><div class="brand">Property Finder Real Estate</div><div class="sub">Mumbai · Maharashtra</div></div>
  </div>`;
}

function renderPreview() {
  const t = TEMPLATES[currentKey];
  if (!t) return;
  const d = getData();
  const preview = document.getElementById('emailPreview');
  preview.className = `email-preview ${t.colorClass}`;
  preview.innerHTML = `
    <div class="ep-header">${renderLogo()}</div>
    <div class="ep-body">
      ${t.html(d)}
      <div class="ep-sign">
        <p>Warm regards,</p>
        <p class="sign-name">Saurav Ganesh Chowdhury</p>
        <p class="sign-co">${COMPANY}</p>
        <p style="font-size:12px;margin-top:6px">📞 ${PHONE} · ✉️ ${EMAIL}</p>
        <p style="font-size:11px;color:#9CA3AF;margin-top:4px">📍 ${ADDRESS}</p>
      </div>
    </div>
    <div class="ep-tagline">"Your Search Ends Here." — ${COMPANY}</div>
    <div class="ep-footer">
      <p>${COMPANY} · ${ADDRESS}</p>
      <p>📞 ${PHONE} · <a href="https://www.${WEB}">${WEB}</a></p>
      <p style="margin-top:8px;opacity:.4">To unsubscribe, reply STOP to this message.</p>
    </div>`;
  /* Update WA bubble */
  document.getElementById('waBubble').textContent = t.wa(d);
}

function loadTmpl(key, btn) {
  currentKey = key;
  document.querySelectorAll('.tmpl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('currentTmplName').textContent = TEMPLATES[key]?.name || '';
  renderPreview();
}

function sendWA() {
  const t = TEMPLATES[currentKey];
  const d = getData();
  const phone = d.phone.replace(/\D/g,'');
  const msg = t.wa(d);
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
}
function sendEmail() {
  const t = TEMPLATES[currentKey];
  const d = getData();
  const subject = t.subject(d);
  const bodyText = t.wa(d).replace(/\*/g,'');
  window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyText)}`;
}
function copyWAText() {
  const t = TEMPLATES[currentKey];
  const d = getData();
  navigator.clipboard.writeText(t.wa(d)).then(() => {
    if (window.showToast) showToast('📋 WhatsApp text copied!','success');
  });
}
function printEmail() {
  window.print();
}


/* ── Read URL params to pre-fill form ── */
(function() {
  const p = new URLSearchParams(window.location.search);
  if (p.get('name'))     document.getElementById('fName').value     = p.get('name');
  if (p.get('phone'))    document.getElementById('fPhone').value    = p.get('phone');
  if (p.get('property')) document.getElementById('fProperty').value = p.get('property');
  const typeParam = p.get('type');
  if (typeParam && TEMPLATES[typeParam]) {
    currentKey = typeParam;
    const btn = document.querySelector(`[onclick="loadTmpl('${typeParam}',this)"]`);
    if (btn) {
      document.querySelectorAll('.tmpl-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  }
  renderPreview();
})();
/* Init */
document.getElementById('fDate').value = new Date().toISOString().split('T')[0];
renderPreview();
